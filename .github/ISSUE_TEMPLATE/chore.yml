name: Chore / CI task
description: Tooling, CI/CD, refactors, docs — anything that doesn't change the rendered profile
labels: []
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: A clear and concise description of the problem or gap.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you'd like to see implemented.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds or alternatives you've thought of.
  - type: dropdown
    id: type
    attributes:
      label: Type
      description: Which surface does this touch?
      options:
        - CI / tooling
        - Security
        - Governance — process / rules / templates
        - Docs
        - Dependencies
