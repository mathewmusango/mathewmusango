name: "Deploy: Pages"

on:
  push:
    branches: [main]
  schedule:
    # Daily — the contribution calendar has no public client-side endpoint, so
    # the page reads it from the committed snapshot. 04:17 UTC = 07:17 EAT.
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Keep the snapshot (and therefore the heatmap) current.
  refresh:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Refresh the snapshot
        run: python3 scripts/fetch_profile.py

      - name: Commit if it moved
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Snapshot already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data assets/img
          git commit -m "chore: refresh the GitHub snapshot"
          git push

  deploy:
    needs: refresh
    # `needs` skips dependents of a skipped job, so opt back in explicitly.
    if: always() && needs.refresh.result != 'failure'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      # ref_name, not the default github.sha — a scheduled run must pick up the
      # snapshot commit the refresh job just pushed.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Stage site
        run: |
          mkdir -p _site
          cp -r index.html assets data _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
