name: checks
services:
  shell:
    image: docker.io/koalaman/shellcheck-alpine:latest
    working_dir: /repo
    volumes:
      - ../..:/repo:ro
    command:
      - sh
      - -c
      - |
        find . -path './.git' -prune -o -type f \( -name '*.sh' -o -path './.githooks/*' \) -print0 2>/dev/null | xargs -0 -r shellcheck -S warning

  yaml:
    image: docker.io/rhysd/actionlint:latest
    working_dir: /repo
    volumes:
      - ../..:/repo:ro
    command: ["-no-color"]

  yaml-syntax:
    image: docker.io/library/ruby:alpine
    working_dir: /repo
    volumes:
      - ../..:/repo:ro
    command:
      - sh
      - -c
      - |
        find . -path './.git' -prune -o -type f \( -name '*.yml' -o -name '*.yaml' \) -print 2>/dev/null | while IFS= read -r f; do
          ruby -ryaml -e "YAML.load_file(ARGV[0])" "$$f" || { echo "FAILED: $$f"; exit 1; }
          echo "ok: $$f"
        done
